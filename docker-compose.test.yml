services:
  test-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: coronagraph_test
      POSTGRES_PASSWORD: coronagraph_test
      POSTGRES_DB: coronagraph_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coronagraph_test"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
